name: Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  AWS_REGION: us-west-1
  EC2_INSTANCE_ID: i-07a210f664f9fd7c0
  EC2_HOST: 54.176.233.246
  EC2_USER: ec2-user
  PROJECT_PATH: /home/ec2-user/test-toolkit-pro
  APP_PORT: 3000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3: Setup Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Step 4: Install dependencies
      - name: Install dependencies
        run: bun install

      # Step 5: Build the project
      - name: Build project
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Step 6: Run linting (optional)
      - name: Lint code
        run: bun run lint
        continue-on-error: true

      # Step 7: Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to project directory
            cd ${{ env.PROJECT_PATH }}
            
            # Pull latest code
            git pull origin main || git pull origin master
            
            # Install dependencies
            bun install
            
            # Build the project
            bun run build
            
            # Restart PM2 app
            pm2 restart quiz-app || pm2 start "PORT=${{ env.APP_PORT }} bun run preview" --name quiz-app
            
            # Save PM2 configuration
            pm2 save
            
            echo "✅ Deployment completed successfully!"
            echo "App is running at http://54.176.233.246/quiz"

      # Step 8: Notify deployment status
      - name: Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful! Visit: http://54.176.233.246"
          else
            echo "❌ Deployment failed!"
          fi
